[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "reportlab>=4.0.0",
    "mcp>=1.24.0",
    "github-copilot-sdk>=0.1.10",
]

[project.scripts]
llm-council = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
packages = ["backend"]
